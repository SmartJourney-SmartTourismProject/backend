services:
  db:
      image: postgres:16-alpine
      container_name: local_postgres
      environment:
        POSTGRES_USER: shaluka
        POSTGRES_PASSWORD: 1234
        POSTGRES_DB: smartjourney
      ports:
        - "5432:5432"
      volumes:
        - db_data:/var/lib/postgresql/data
      restart: always

volumes:
  db_data: