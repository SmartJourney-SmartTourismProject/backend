services:
  db:
    # PostGIS, not plain postgres - the schema uses geography(Point,4326)
    # columns (travel_listing.location, traveler_profile.home_location), which
    # a stock postgres image cannot create. See docs/BACKEND_PLAN.md §3.1.
    #
    # Built, not pulled, as of the RAG knowledge base (db/migrations/0013):
    # db/Dockerfile adds pgvector (knowledge_chunk.embedding) on top of this
    # same image via one apt package - no source build. Same Postgres 16
    # major version, so an existing db_data volume is unaffected; run
    # `docker compose up -d --build db` once to pick this up.
    build: ./db
    container_name: smartjourney_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Only runs on a genuinely empty data volume (Postgres init-script
      # behavior) - see docs/master_plan/DATA_PLATFORM.md §1's gotcha note.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # So dependent services (and `docker compose up --wait`) don't start
      # talking to the DB before it can actually accept connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    # Cache for weather (45 min TTL) and disaster (1 h) lookups - see
    # ai-backend/app/utils/cache.py, which silently no-ops without it and
    # re-fetches from OpenWeather on every single request.
    # Pure cache: no persistence, so a restart just means a cold cache.
    image: redis:7-alpine
    container_name: smartjourney_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  keycloak_db:
    # Keycloak's own storage (realms, clients, users) - kept separate from
    # the app's PostGIS database above so Keycloak's tables never mix with
    # ours.
    image: postgres:16
    container_name: smartjourney_keycloak_db
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: smartjourney_keycloak
    # --import-realm loads ./keycloak/realm-export.json on first boot so every
    # machine gets the same realm/clients/roles/password policy. If the realm
    # already exists in keycloak_db the import is skipped, so it never
    # overwrites changes made in the admin console. Re-export after changing
    # realm config (see keycloak/README.md).
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Google sign-in identity provider. realm-export.json references these
      # as ${GOOGLE_SIGNIN_CLIENT_ID} / ${GOOGLE_SIGNIN_CLIENT_SECRET} so the
      # secret never lands in git. Distinct from the AI backend's
      # GOOGLE_CALENDAR_* client - see docs/BACKEND_PLAN.md §2.
      GOOGLE_SIGNIN_CLIENT_ID: ${GOOGLE_SIGNIN_CLIENT_ID}
      GOOGLE_SIGNIN_CLIENT_SECRET: ${GOOGLE_SIGNIN_CLIENT_SECRET}
      # Secret of the confidential smartjourney-web client (used by next-auth).
      # Same trick: realm-export.json holds ${KEYCLOAK_WEB_CLIENT_SECRET}. Must
      # equal KEYCLOAK_CLIENT_SECRET in frontend-web/.env.local.
      KEYCLOAK_WEB_CLIENT_SECRET: ${KEYCLOAK_WEB_CLIENT_SECRET}
      # Outgoing mail for "forgot password" and email verification. The realm
      # export references these as ${KC_SMTP_*}. Local default is the mailpit
      # service below (no credentials, inbox at http://localhost:8025);
      # production points them at a real provider (Gmail app password, SES...).
      KC_SMTP_HOST: ${KC_SMTP_HOST:-mailpit}
      KC_SMTP_PORT: ${KC_SMTP_PORT:-1025}
      KC_SMTP_FROM: ${KC_SMTP_FROM:-noreply@smartjourney.local}
      KC_SMTP_FROM_DISPLAY_NAME: ${KC_SMTP_FROM_DISPLAY_NAME:-SmartJourney}
      KC_SMTP_AUTH: ${KC_SMTP_AUTH:-false}
      KC_SMTP_USER: ${KC_SMTP_USER:-}
      KC_SMTP_PASSWORD: ${KC_SMTP_PASSWORD:-}
      KC_SMTP_STARTTLS: ${KC_SMTP_STARTTLS:-false}
      KC_SMTP_SSL: ${KC_SMTP_SSL:-false}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # SmartJourney login theme (keycloak/themes/smartjourney). start-dev
      # doesn't cache themes, so CSS edits show on a browser refresh. An
      # existing realm is switched to it by keycloak/apply-theme.sh.
      - ./keycloak/themes/smartjourney:/opt/keycloak/themes/smartjourney:ro
    ports:
      # host 8081 -> container 8080, since something else on this machine
      # already holds host port 8080
      - "8081:8080"
    depends_on:
      keycloak_db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  mailpit:
    # Local SMTP sink so Keycloak's password-reset / verify-email mails can
    # be tested without a real mail provider. Every message it receives is
    # viewable at http://localhost:8025 (and via its REST API for tests).
    # Not for production - swap the KC_SMTP_* vars above instead.
    image: axllent/mailpit:latest
    container_name: smartjourney_mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web inbox
    restart: unless-stopped

volumes:
  db_data:
  keycloak_db_data: