# SmartJourney login theme: Keycloak's own keycloak.v2 pages (sign in,
# register, forgot/reset password, verify email, update password) restyled to
# match the web app's sign-in card - see backend/keycloak/README.md "Login
# theme". CSS and message overrides only, no template copies, so it keeps
# working when the Keycloak image is upgraded.
parent=keycloak.v2
import=common/keycloak

# The parent's styles.css first (layout, tooltips), then ours on top.
styles=css/styles.css css/smartjourney.css
