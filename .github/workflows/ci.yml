name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual run. "rebuild_all" also rebuilds and redeploys the db and keycloak
  # images - needed once for the very first deploy (deploy/MANUAL_SETUP.md).
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: Rebuild and redeploy the db and keycloak images too
        type: boolean
        default: false

# No external services here on purpose - unit specs fake Prisma directly
# (see src/**/*.spec.ts) and the e2e suite fakes both Prisma and the
# Keycloak-issued JWT (test/app.e2e-spec.ts), so the whole job needs
# neither Postgres nor a running Keycloak. See
# Documentation/Testing/MASTER_TEST_PLAN.md for what that trades away.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e

  # ---- CD: only on main, only after the tests pass --------------------------
  # Images go to GHCR tagged with the commit SHA (plus :latest). The db and
  # keycloak images rarely change, so they are rebuilt only when their files do
  # (or on a manual run with rebuild_all).
  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/smartjourney-smarttourismproject
    outputs:
      db_changed: ${{ steps.flags.outputs.db }}
      keycloak_changed: ${{ steps.flags.outputs.keycloak }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            db:
              - 'db/Dockerfile'
              - 'db/init/**'
            keycloak:
              - 'keycloak/realm-export.json'
              - 'keycloak/themes/**'
              - 'deploy/keycloak.Dockerfile'
      - name: Decide what to rebuild
        id: flags
        run: |
          force="${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_all }}"
          echo "db=$([ "${{ steps.changes.outputs.db }}" = true ] || [ "$force" = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "keycloak=$([ "${{ steps.changes.outputs.keycloak }}" = true ] || [ "$force" = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/backend:${{ github.sha }}
            ${{ env.REGISTRY }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build migrate
        uses: docker/build-push-action@v6
        with:
          context: db
          file: deploy/migrate.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/migrate:${{ github.sha }}
            ${{ env.REGISTRY }}/migrate:latest
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max
      - name: Build db (PostGIS + pgvector)
        if: steps.flags.outputs.db == 'true'
        uses: docker/build-push-action@v6
        with:
          context: db
          push: true
          tags: |
            ${{ env.REGISTRY }}/db:${{ github.sha }}
            ${{ env.REGISTRY }}/db:latest
          cache-from: type=gha,scope=db
          cache-to: type=gha,scope=db,mode=max
      - name: Build keycloak (realm + theme baked in)
        if: steps.flags.outputs.keycloak == 'true'
        uses: docker/build-push-action@v6
        with:
          context: keycloak
          file: deploy/keycloak.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/keycloak:${{ github.sha }}
            ${{ env.REGISTRY }}/keycloak:latest
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,scope=keycloak,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # One production deploy at a time, across every repo's pipeline.
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
      LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
      SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
    steps:
      # Until the server exists and the secrets are added (deploy/MANUAL_SETUP.md
      # section 6) this job skips cleanly instead of failing the pipeline.
      - name: Check deploy secrets
        id: gate
        run: |
          if [ -z "$LIGHTSAIL_HOST" ] || [ -z "$LIGHTSAIL_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "::notice::Deploy skipped: LIGHTSAIL_HOST / LIGHTSAIL_USER / LIGHTSAIL_SSH_KEY are not configured."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
      - name: Set up SSH
        if: steps.gate.outputs.enabled == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts
      - name: Copy deployment files to the server
        if: steps.gate.outputs.enabled == 'true'
        run: |
          scp -i ~/.ssh/deploy_key \
            deploy/compose.prod.yml deploy/Caddyfile deploy/compose.sh deploy/deploy.sh deploy/backup.sh \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:/opt/smartjourney/"
          ssh -i ~/.ssh/deploy_key "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" 'chmod +x /opt/smartjourney/*.sh'
      - name: Migrate and deploy
        if: steps.gate.outputs.enabled == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" bash -se <<EOF
          set -euo pipefail
          cd /opt/smartjourney
          SHA=${{ github.sha }}

          # Infrastructure (no-ops when already running).
          ./compose.sh up -d db keycloak_db redis

          # New SQL migrations first: they are additive, so the old backend
          # keeps working until the new one replaces it.
          BACKEND_TAG=\$SHA ./compose.sh run --rm migrate

          if [ "${{ needs.build.outputs.db_changed }}" = true ]; then ./deploy.sh db \$SHA; fi
          if [ "${{ needs.build.outputs.keycloak_changed }}" = true ]; then ./deploy.sh keycloak \$SHA; fi
          ./deploy.sh backend \$SHA

          # First deploy only: bring up whatever is not running yet.
          ./compose.sh up -d keycloak caddy
          ./compose.sh ps
          EOF
